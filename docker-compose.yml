services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-review_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.32.5
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.32.5
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      AI_MODEL: ${AI_MODEL:-qwen3:4b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${AI_MODEL}\" && ollama pull \"$${EMBEDDING_MODEL}\""]
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      AI_BASE_URL: http://ollama:11434
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./config:/app/config:ro
      - ./knowledge:/app/knowledge:ro

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:

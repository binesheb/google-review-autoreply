[project]
name = "jayalakshmi-review-platform"
version = "0.1.0"
description = "Local-first Google Business Profile Review Intelligence & Response Platform"
requires-python = ">=3.11"

[project.dependencies]
fastapi = ">=0.115,<1"
uvicorn = {version = ">=0.34,<1", extras = ["standard"]}
pydantic-settings = ">=2.7,<3"
sqlalchemy = ">=2.0,<3"
psycopg = {version = ">=3.2,<4", extras = ["binary"]}
httpx = ">=0.28,<1"
pyyaml = ">=6.0,<7"
google-auth = ">=2.38,<3"
google-auth-oauthlib = ">=1.2,<2"
rapidfuzz = ">=3.12,<4"

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
